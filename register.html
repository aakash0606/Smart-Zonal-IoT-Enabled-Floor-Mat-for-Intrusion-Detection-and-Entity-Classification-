<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - AnTheFloor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <input type="text" id="fullname" placeholder="Full Name">
    <select id="security">
      <option value="">Select Security Based Area</option>
      <option value="museum">MUSEUM</option>
      <option value="bank">BANK LOCKERS</option>
      <option value="dataCenter">DATA CENTERS</option>
      <option value="others">Others</option>
    </select>
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="createBtn">Create Account</button>
    <div class="signin-link">
      Already have an account? <a href="signin.html">Sign In</a>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module" src="js/register.js"></script>
</body>
</html>
